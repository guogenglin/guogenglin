name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # Generate personal stats card
      - name: Generate personal stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=guogenglin&show_icons=true&include_all_commits=true&hide=prs&theme=vue&transparent=true&hide_border=true
          path: profile/stats-guogenglin.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # Generate personal top languages card
      - name: Generate personal top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=guogenglin&layout=compact&theme=vue&transparent=true&hide_border=true
          path: profile/top-langs-guogenglin.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # Commit cards
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
